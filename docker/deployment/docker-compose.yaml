#version: "3.8"                          Docker Compose Syntax версия
#services:                               Раздел, содержащий все контейнеры для запуска.
#  catalog-service:                      Раздел, описывающий контейнер службы каталога
#    depends_on:                         Служба каталогов должна запускаться после базы данных PostgreSQL
#      - polar-postgres
#    image: "catalog-service"            Образ, используемый для запуска контейнера
#    container_name: "catalog-service"   Имя контейнера
#    ports:                              Раздел со списком сопоставлений портов
#      - 9001:9001                       порт приложения
#      - 8001:8001                       порт отладки
#    environment:                        В разделе перечислены переменные среды
#      - BPL_JVM_THREAD_COUNT=50         Переменная среды Paketo Buildpacks для настройки количества потоков для расчета памяти
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://polar-postgres:5432/polardb_catalog
#      - SPRING_PROFILES_ACTIVE=testdata Включает пружинный профиль «TestData»
#  polar-postgres:                       Раздел, описывающий контейнер Polar-postgres.
#    image: "postgres:14.4"
#    container_name: "polar-postgres"
#    ports:
#      - 5432:5432
#    environment:
#      - POSTGRES_USER=user
#      - POSTGRES_PASSWORD=password
#      - POSTGRES_DB=polardb_catalog

version: "3.8"

networks:
  pbs-network:
    driver: bridge

services:
  pbs-config-service:
    image: "goppot/pbs-config-service:1.0.0"
    container_name: "pbs-config-service"
    ports:
      - 8888:8888
    networks:
      - pbs-network

  pbs-edge-service:
    depends_on:
      - fluent-bit
      - tempo
    image: "goppot/pbs-edge-service:3.0.0"
    container_name: "pbs-edge-service"
    ports:
      - 9000:9000
    environment:
      - BPL_JVM_THREAD_COUNT=50
      - SPRING_CLOUD_CONFIG_URI=http://pbs-config-service:8888
      - CATALOG_SERVICE_URL=http://pbs-catalog-service:9001
      - ORDER_SERVICE_URL=http://pbs-order-service:9002
      - SPA_URL=http://pbs-ui:9004
      - REDIS_HOST=pbs-redis
      #Поручает JVM запустить Java-агент OpenTelemetry из пути, по которому Cloud Native Buildpacks разместил зависимости приложения.
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
      #Имя приложения, используемое для маркировки следов, созданных службой каталогов.
      - OTEL_SERVICE_NAME=catalog-service
      #URL-адрес серверной части распределенной трассировки, поддерживающей протокол OpenTelemetry (OTLP).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_METRICS_EXPORTER=none
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
    networks:
      - pbs-network
        
  pbs-catalog-service:
    depends_on:
      - fluent-bit
      - pbs-postgres
      - pbs-config-service
      - tempo
    image: "goppot/pbs-catalog-service:3.0.0"
    container_name: "pbs-catalog-service"
    ports:
      - 9001:9001
    environment:
      - BPL_JVM_THREAD_COUNT=50
      - SPRING_CLOUD_CONFIG_URI=http://pbs-config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://pbs-postgres:5432/polardb_catalog
      - SPRING_PROFILES_ACTIVE=testdata
        #Поручает JVM запустить Java-агент OpenTelemetry из пути, по которому Cloud Native Buildpacks разместил зависимости приложения.
      - JAVA_TOOL_OPTIONS=-javaagent:/app/opentelemetry-javaagent.jar
        #Имя приложения, используемое для маркировки следов, созданных службой каталогов.
      - OTEL_SERVICE_NAME=catalog-service
        #URL-адрес серверной части распределенной трассировки, поддерживающей протокол OpenTelemetry (OTLP).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      - OTEL_METRICS_EXPORTER=none
    logging:
      driver: fluentd
      options:
        fluentd-address: 127.0.0.1:24224
    networks:
      - pbs-network

  pbs-order-service:
    depends_on:
      - pbs-postgres
      - pbs-config-service
      - pbs-catalog-service
      - pbs-rabbitmq
    image: "goppot/pbs-order-service:1.0.0"
    container_name: pbs-order-service
    ports:
      - 9002:9002
    environment:
      - POLAR_CATALOG_SERVICE_URI=http://pbs-catalog-service:9001
      - SPRING_CLOUD_CONFIG_URI=http://pbs-config-service:8888
      - SPRING_R2DBC_URL=r2dbc:postgresql://pbs-postgres:5432/polardb_order
      - SPRING_FLYWAY_URL=jdbc:postgresql://pbs-postgres:5432/polardb_order
      - SPRING_RABBITMQ_HOST=pbs-rabbitmq
    networks:
      - pbs-network

  pbs-postgres:
    image: "postgres:15.0"
    container_name: "pbs-postgres"
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      #Запустит скрипты из пакета
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - pbs-network
        
  pbs-redis:
    image: "redis:7.2-alpine"
    container_name: "pbs-redis"
    ports:
      - 6379:6379
    networks:
      - pbs-network

  pbs-rabbitmq:
    image: rabbitmq:3.10-management
    container_name: pbs-rabbitmq
    ports:
      #Порт, на котором RabbitMQ прослушивает запросы AMQP.
      - 5672:5672
      #Порт, который предоставляет доступ к файлу конфигурации
      - 15672:15672
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    networks:
      - pbs-network

  pbs-keycloak:
    image: quay.io/keycloak/keycloak:19.0
    container_name: "pbs-keycloak"
    #Запускает Keycloak в режиме разработки (с использованием встроенной базы данных)
    #Импортирует предоставленную конфигурацию во время запуска.
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=user
      - KEYCLOAK_ADMIN_PASSWORD=password
    ports:
      - 8080:8080
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - pbs-network
  # docker-compose -f docker/deployment/docker-compose.yaml up -d pbs-keycloak

  pbs-ui:
    image: "ghcr.io/polarbookshop/polar-ui:v1"
    container_name: "pbs-ui"
    ports:
      #NGINX будет обслуживать SPA через порт 9004.
      - 9004:9004
    environment:
      #Настраивает порт сервера NGINX.
      - PORT=9004
    networks:
      - pbs-network
  # docker-compose -f docker/deployment/docker-compose.yaml up -d pbs-ui

  grafana:
    image: grafana/grafana:9.1.2
    container_name: grafana
    depends_on:
      - loki
      - prometheus
      - tempo
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=user
      - GF_SECURITY_ADMIN_PASSWORD=password
    volumes:
      - ./observability/grafana/datasources/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./observability/grafana/grafana.ini:/etc/grafana/grafana.ini
    networks:
      - pbs-network

  loki:
    image: grafana/loki:2.6.1
    container_name: loki
    depends_on:
      - fluent-bit
    ports:
      - "3100:3100"
    networks:
      - pbs-network

  fluent-bit:
    image: grafana/fluent-bit-plugin-loki:2.6.1-amd64
    container_name: fluent-bit
    ports:
      - "24224:24224"
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    volumes:
      - ./observability/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
    networks:
      - pbs-network

  prometheus:
    image: prom/prometheus:v2.38.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
    - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - pbs-network

  tempo:
    image: grafana/tempo:1.5.0
    container_name: tempo
    command: -config.file /etc/tempo-config.yml
    ports:
      - "4317:4317"
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo-config.yml
    networks:
      - pbs-network


  #docker-compose -f docker/deployment/docker-compose.yaml up -d grafana


# docker-compose -f docker/deployment/docker-compose.yaml up -d

