server:
  port: 9001
  #Включить изящное отключение
  shutdown: graceful
  tomcat:
    #  тайм-аут соединения: 2 с
    connection-timeout: 2s
    #  тайм-аут поддержания активности: 15 с
    keep-alive-timeout: 15s
    threads:
      max: 50
      min-spare: 5

spring:
  application:
    name: catalog-service
  lifecycle:
    #Определяет льготный период 15 с.
    timeout-per-shutdown-phase: 15s
  datasource:
    username: user
    password: password
    url: jdbc:postgresql://localhost:5432/polardb_catalog
    hikari:
      #Максимальное время (мс), которое потребуется потратить на ожидание соединения из пула.
      connection-timeout: 2000
      #Максимальное количество соединений, которые HikariCP будет хранить в пуле.
      maximum-pool-size: 5
  #Запускает файл src/main/resources/schema.sql при старте
  sql:
    init:
      mode: always
  config:
    #Импортирует данные конфигурации с сервера конфигурации, если они доступны
    #import: "optional:configserver:"
    #Прекращает импорт данных конфигурации из службы конфигурации.
    import: ""
  cloud:
    config:
      #Отключает интеграцию клиента Spring Cloud Config.
      enabled: false
      uri: http://localhost:8888
      #Таймаут ожидания подключения к серверу конфигурации (мс)
      request-connect-timeout: 5000
      #Тайм-аут ожидания чтения данных конфигурации с сервера конфигурации (мс)
      request-read-timeout: 5000
      #Делает сбой при подключении к серверу конфигурации фатальным.
      fail-fast: true
      #Поведение повторной попытки включено только в том случае, если fail-fast: true
      retry:
        #Максимальное количество попыток
        max-attempts: 6
        #Начальный интервал повтора для отсрочки (мс)
        initial-interval: 1000
        #Максимальный интервал повторных попыток отсрочки (мс)
        max-interval: 2000
        #Множитель для вычисления следующего интервала
        multiplier: 1.1

management:
  endpoints:
    web:
      exposure:
        #По умолчанию конечная точка не отображается, поэтому вам необходимо явно включить.
        #Предоставляет конечные точки как работоспособности, так и показателей.
        #Предоставляет конечную точку /actuator/refresh через HTTP.
        #Предоставляет конечную точку /actuator/health через HTTP.
        #Предоставляет конечную точку /actuator/metrics через HTTP.
        #Предоставляет конечную точку /actuator/prometheus через HTTP.
        include: refresh, health, info, heapdump, metrics, prometheus, flyway
  endpoint:
    #http :9001/actuator/health
    health:
      #Всегда показывает подробную информацию о состоянии приложения
      show-details: always
      #Всегда показывает информацию о компонентах, используемых приложением
      show-components: always
      probes:
        #http :9001/actuator/health/readiness Когда он не готов, Kubernetes не будет отправлять трафик на экземпляр приложения.
        #http :9001/actuator/health/liveness
        #Включает поддержку зондов работоспособности
        enabled: true
    heapdump:
      enabled: true
  metrics:
    tags:
      #Добавляет общий тег Micrometer с именем приложения. В результате ко всем метрикам применяется метка Prometheus.
      application: ${spring.application.name}
  #http:9001/actuator/info
  info:
    env:
      #Включает информацию об окружающей среде, полученную из "info". Характеристики
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

polar:
  greeting: Welcome to the local block catalog!

logging:
  pattern:
    #Включает имя приложения, идентификатор трассировки и идентификатор диапазона рядом с уровнем журнала (%5p).
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

#Любое свойство, начинающееся с "info". Префикс будет возвращен конечной точкой info.
info:
  system: Polar Bookshop