apiVersion: v1
kind: ConfigMap
metadata:
  name: pbs-postgres-init-databases
data:
  init.sql: |
    CREATE DATABASE polardb_catalog;
    CREATE DATABASE polardb_order;

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pbs-rabbitmq-config
  labels:
    db: pbs-rabbitmq
data:
  rabbitmq.conf: |
    default_user = user
    default_pass = password
    vm_memory_high_watermark.relative = 1.0

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: pbs-catalog-config
  labels:
    app: pbs-catalog-service
data:
  application.yml: |
    polar:
      greeting: Welcome to the book catalog from Kubernetes!
    spring:
      datasource:
        url: jdbc:postgresql://pbs-postgres:5432/polardb_catalog
      security:
        oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://pbs-keycloak/realms/PolarBookshop

#kubectl apply -f k8s/configmap/config-map.yaml

#kubectl get cm -l app=pbs-catalog-service
