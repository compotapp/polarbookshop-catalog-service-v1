apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-redis
  labels:
    db: pbs-redis
spec:
  selector:
    matchLabels:
      db: pbs-redis
  template:
    metadata:
      labels:
        db: pbs-redis
    spec:
      containers:
        - name: pbs-redis
          image: redis:7.2-alpine
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 200m
              memory: 100Mi

---

apiVersion: v1
kind: Service
metadata:
  name: pbs-redis
  labels:
    db: pbs-redis
spec:
  type: ClusterIP
  selector:
    db: pbs-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379

# kubectl apply -f k8s/manifest/redis.yaml