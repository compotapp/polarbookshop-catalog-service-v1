apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-rabbitmq
  labels:
    db: pbs-rabbitmq
spec:
  selector:
    matchLabels:
      db: pbs-rabbitmq
  template:
    metadata:
      labels:
        db: pbs-rabbitmq
    spec:
      containers:
        - name: pbs-rabbitmq
          image: rabbitmq:3.13-management
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 150Mi
          volumeMounts:
            - mountPath: /etc/rabbitmq
              name: rabbitmq-config-volume
      volumes:
        - name: rabbitmq-config-volume
          configMap:
            name: rabbitmq-config

---

apiVersion: v1
kind: Service
metadata:
  name: pbs-rabbitmq
  labels:
    db: pbs-rabbitmq
spec:
  type: ClusterIP
  selector:
    db: pbs-rabbitmq
  ports:
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
    - name: management
      protocol: TCP
      port: 15672
      targetPort: 15672


