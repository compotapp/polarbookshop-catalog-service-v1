apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbs-config-service
  labels:
    app: pbs-config-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pbs-config-service
  template:
    metadata:
      labels:
        app: pbs-config-service
    spec:
      containers:
        - name: pbs-config-service
          image: goppot/pbs-config-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              
---

apiVersion: v1
kind: Service
metadata:
  name: pbs-config-service
  labels:
    app: pbs-config-service
spec:
  type: ClusterIP
  selector:
    app: pbs-config-service
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888

#kubectl apply -f k8s/manifest/config-service.yaml